name: Android build
run-name: Android ${{ inputs.variant || 'debug' }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug: diagnostics; release: stable signing secrets required'
        type: choice
        options: [debug, release]
        default: debug
  push:
    paths:
      - 'android/**'
      - 'pro/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'pro/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ inputs.variant || 'debug' }}
  cancel-in-progress: true
jobs:
  debug-build:
    name: APK (${{ inputs.variant || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official ref
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, verified official ref
        with:
          distribution: temurin
          java-version: '17'
      - name: Select reviewed APK variant
        id: variant
        env:
          REQUESTED_VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          case "$REQUESTED_VARIANT" in
            debug) suffix=Debug ;;
            release) suffix=Release ;;
            *) echo '::error::Unsupported variant'; exit 1 ;;
          esac
          echo "APK_VARIANT=$REQUESTED_VARIANT" >> "$GITHUB_ENV"
          echo "APK_TASK_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "variant=$REQUESTED_VARIANT" >> "$GITHUB_OUTPUT"
      - name: Check release signing bindings without reading values
        if: ${{ steps.variant.outputs.variant == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'];
          const missing = names.filter(name => !process.env[name]);
          if (missing.length) {
            console.log('::error title=Release signing bindings::Missing requirements in this workflow context: ' + missing.join(', '));
            process.exit(1);
          }
          console.log('::notice title=Release signing bindings::All four requirements present; no values disclosed');
          NODE
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Audit Node dependencies with explicit scope
        run: |
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --json > artifacts/npm-audit.json 2> artifacts/npm-audit.stderr
          audit_exit=$?
          set -e
          echo "Node audit command exit code: $audit_exit"
          node scripts/report-npm-audit.mjs
      - name: Compare native calculation and lifecycle gate with existing model
        run: |
          mkdir -p artifacts
          npm run test:android:core 2>&1 | tee artifacts/native-core.log
      - name: Run Pro regression tests
        run: npm run test:pro 2>&1 | tee artifacts/pro-tests.log
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3, verified signed tags
        with:
          gradle-version: '8.9'
      - name: Generate missing Wrapper and verify official SHA-256
        id: wrapper
        run: npm run prepare:android:wrapper
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3, verified signed tags
      - name: Configure Android SDK 35
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo '::error::Android SDK command-line tools are missing from the runner'
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          "$sdk_manager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check APK policy audit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build, lint and report dependencies using Wrapper
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --console=plain ":app:assemble${APK_TASK_SUFFIX}" ":app:lint${APK_TASK_SUFFIX}" :app:dependencies :app:writeRuntimeSecurityDependencies --stacktrace 2>&1 | tee ../artifacts/android-build.log
      - name: Audit resolved Android runtime libraries with OSV
        run: python scripts/audit-android-dependencies.py --input artifacts/android-runtime-dependencies.json --output artifacts/android-dependency-audit.json --variant "$APK_VARIANT"
      - name: Sign release with maintained private key
        if: ${{ steps.variant.outputs.variant == 'release' && github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          key_file="$RUNNER_TEMP/traderadar-signing.jks"
          trap 'rm -f "$key_file"' EXIT
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          for (const name of ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
            if (!process.env[name]) throw Error('Missing release signing requirement: ' + name + '; configure repository secrets securely');
          }
          await writeFile(process.env.RUNNER_TEMP + '/traderadar-signing.jks', Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          NODE
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$key_file" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify signature, final permissions and packaged UI
        run: |
          trap 'echo "::error title=APK verification::Failed at verification line $LINENO: $BASH_COMMAND"' ERR
          apk="android/app/build/outputs/apk/$APK_VARIANT/app-$APK_VARIANT.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee artifacts/apk-signature.log
          unzip -Z1 "$apk" > artifacts/apk-files.txt
          grep -Fx 'assets/pro/index.html' artifacts/apk-files.txt
          grep -Fx 'assets/pro/app.js' artifacts/apk-files.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > artifacts/apk-manifest.xml
          python scripts/audit-android-package.py --manifest artifacts/apk-manifest.xml --apk "$apk" --variant "$APK_VARIANT" --output artifacts/android-package-audit.json
          node scripts/write-android-build-info.mjs
          mkdir -p artifacts/apk
          cp "$apk" "artifacts/apk/app-$APK_VARIANT.apk"
          cp artifacts/android-build-info.json artifacts/android-package-audit.json artifacts/apk-signature.log artifacts/android-runtime-dependencies.json artifacts/android-dependency-audit.json artifacts/npm-audit.json artifacts/apk/

      - name: Upload verified signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: traderadar-android-${{ steps.variant.outputs.variant }}-apk
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified complete Gradle Wrapper
        if: ${{ always() && steps.wrapper.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: traderadar-gradle-wrapper-8.9
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: traderadar-android-build-diagnostics
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/android-build-info.json
            artifacts/android-package-audit.json
            artifacts/android-runtime-dependencies.json
            artifacts/android-dependency-audit.json
            artifacts/npm-audit.json
            artifacts/npm-audit.stderr
            artifacts/apk-manifest.xml
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/traderadar-signing.jks"
      - name: Explain artifact and validation scope
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## APK security evidence
          Download the matching **traderadar-android-debug-apk** or **traderadar-android-release-apk** artifact.
          Compare android-build-info.json (APK SHA-256/commit), apk-signature.log (public certificate), and android-package-audit.json.
          Debug builds are diagnostic. A release build requires the maintained private signing key; a signature does not establish Play Protect approval.
          Compilation, lint and packaging policy checks do not establish Android device/background operation or absence of malware.
          Binance TR remains gated until its official endpoints and actual REST/WebSocket data are verified.
          The verified Wrapper is separately available as **traderadar-gradle-wrapper-8.9**.
          SUMMARY
