name: UI sections regression
on:
  push:
    paths:
      - 'index.html'
      - 'server.js'
      - 'tab-navigation-fix.js'
      - 'removed-sections.test.js'
      - '.github/workflows/ui-sections-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check tab-navigation-fix.js
      - run: node --test removed-sections.test.js
