name: Momentum confirmed-only regression
on:
  push:
    paths:
      - 'momentum-30s-model.js'
      - 'momentum-scan-config.js'
      - 'momentum-scan-config.test.js'
      - 'momentum-price-only.test.js'
      - 'momentum-visibility.js'
      - 'momentum-visibility.test.js'
      - 'minute-momentum-watch.js'
      - 'minute-momentum-ui.js'
      - 'index.html'
      - '.github/workflows/momentum-confirmed-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check momentum-30s-model.js
          node --check momentum-scan-config.js
          node --check momentum-visibility.js
          node --check minute-momentum-watch.js
          node --check minute-momentum-ui.js
      - name: Test confirmed-only gating
        run: node --test momentum-visibility.test.js momentum-price-only.test.js momentum-scan-config.test.js
